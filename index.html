<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Hello</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #293044;
      background: linear-gradient(135deg, #fce4ec, #e8eaf6, #e0f7fa);
    }
    main {
      width: min(90%, 560px);
      padding: 56px 32px;
      text-align: center;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(50, 55, 90, .12);
      animation: appear .8s ease-out both;
    }
    .hello { font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 0 0 14px; }
    p { font-size: 1.15rem; line-height: 1.6; color: #626a7d; margin: 0 0 28px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 25px;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      background: #7772c8;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }
    button:hover { transform: translateY(-2px); background: #625db2; }
    #reply { min-height: 28px; margin-top: 22px; color: #625db2; font-weight: 600; }
    @keyframes appear { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <main>
    <h1 class="hello">Hi, how are you? 👋</h1>
    <p>Welcome! It's lovely to have you here.</p>
    <button type="button" onclick="document.getElementById('reply').textContent = 'I hope you’re having a wonderful day! ✨'">
      I'm doing great!
    </button>
    <div id="reply" aria-live="polite"></div>
  </main>
</body>
</html>
